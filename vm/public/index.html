<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Classic Games</title>
  <meta name="description" content="Choose a classic game to play online or against the computer.">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="eyebrow"><span></span> CLASSIC GAMES <span></span></div>
      <h1>Choose your table.</h1>
      <p>Two timeless games. Play online or against the computer.</p>
    </header>

    <section class="games" aria-label="Available games">
      <a class="game-card" href="https://backgammon.129.146.112.160.sslip.io" aria-label="Play Backgammon">
        <div class="art board-art" aria-hidden="true">
          <svg class="board" viewBox="0 0 620 330" role="presentation">
            <defs>
              <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#7f4b2c"/>
                <stop offset=".48" stop-color="#9b6139"/>
                <stop offset="1" stop-color="#68402a"/>
              </linearGradient>
              <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#5a3325"/>
                <stop offset="1" stop-color="#3d241d"/>
              </linearGradient>
              <radialGradient id="ivoryChecker" cx="35%" cy="28%" r="70%">
                <stop offset="0" stop-color="#fff8e8"/>
                <stop offset="1" stop-color="#d8c7a8"/>
              </radialGradient>
              <radialGradient id="darkChecker" cx="35%" cy="28%" r="70%">
                <stop offset="0" stop-color="#55463b"/>
                <stop offset="1" stop-color="#211b18"/>
              </radialGradient>
              <filter id="pieceShadow" x="-30%" y="-30%" width="160%" height="180%">
                <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".42"/>
              </filter>
            </defs>

            <rect x="31" y="20" width="558" height="290" rx="16" fill="url(#wood)" stroke="#bd8654" stroke-opacity=".42" stroke-width="2"/>
            <rect x="48" y="37" width="524" height="256" rx="8" fill="url(#felt)" stroke="#2b1914" stroke-width="2"/>
            <rect x="299" y="37" width="22" height="256" fill="#72452e"/>
            <rect x="302" y="37" width="16" height="256" fill="#38221b" opacity=".46"/>

            <!-- top points -->
            <g>
              <polygon points="53,42 91,42 72,151" fill="#d4a568"/>
              <polygon points="94,42 132,42 113,151" fill="#633222"/>
              <polygon points="135,42 173,42 154,151" fill="#d4a568"/>
              <polygon points="176,42 214,42 195,151" fill="#633222"/>
              <polygon points="217,42 255,42 236,151" fill="#d4a568"/>
              <polygon points="258,42 296,42 277,151" fill="#633222"/>
              <polygon points="324,42 362,42 343,151" fill="#d4a568"/>
              <polygon points="365,42 403,42 384,151" fill="#633222"/>
              <polygon points="406,42 444,42 425,151" fill="#d4a568"/>
              <polygon points="447,42 485,42 466,151" fill="#633222"/>
              <polygon points="488,42 526,42 507,151" fill="#d4a568"/>
              <polygon points="529,42 567,42 548,151" fill="#633222"/>
            </g>

            <!-- bottom points -->
            <g>
              <polygon points="53,288 91,288 72,179" fill="#633222"/>
              <polygon points="94,288 132,288 113,179" fill="#d4a568"/>
              <polygon points="135,288 173,288 154,179" fill="#633222"/>
              <polygon points="176,288 214,288 195,179" fill="#d4a568"/>
              <polygon points="217,288 255,288 236,179" fill="#633222"/>
              <polygon points="258,288 296,288 277,179" fill="#d4a568"/>
              <polygon points="324,288 362,288 343,179" fill="#633222"/>
              <polygon points="365,288 403,288 384,179" fill="#d4a568"/>
              <polygon points="406,288 444,288 425,179" fill="#633222"/>
              <polygon points="447,288 485,288 466,179" fill="#d4a568"/>
              <polygon points="488,288 526,288 507,179" fill="#633222"/>
              <polygon points="529,288 567,288 548,179" fill="#d4a568"/>
            </g>

            <!-- checkers -->
            <g filter="url(#pieceShadow)" stroke-width="2">
              <g fill="url(#ivoryChecker)" stroke="#fff4dd" stroke-opacity=".58">
                <circle cx="72" cy="62" r="18"/><circle cx="72" cy="88" r="18"/>
                <circle cx="236" cy="61" r="18"/><circle cx="236" cy="87" r="18"/><circle cx="236" cy="113" r="18"/>
                <circle cx="466" cy="269" r="18"/><circle cx="466" cy="243" r="18"/><circle cx="466" cy="217" r="18"/>
                <circle cx="548" cy="269" r="18"/><circle cx="548" cy="243" r="18"/>
              </g>
              <g fill="url(#darkChecker)" stroke="#6d5d50" stroke-opacity=".66">
                <circle cx="113" cy="269" r="18"/><circle cx="113" cy="243" r="18"/>
                <circle cx="195" cy="269" r="18"/><circle cx="195" cy="243" r="18"/><circle cx="195" cy="217" r="18"/>
                <circle cx="384" cy="61" r="18"/><circle cx="384" cy="87" r="18"/><circle cx="384" cy="113" r="18"/>
                <circle cx="548" cy="61" r="18"/><circle cx="548" cy="87" r="18"/>
              </g>
            </g>

            <!-- dice -->
            <g transform="translate(286 151) rotate(-8)" filter="url(#pieceShadow)">
              <rect x="-38" y="-18" width="36" height="36" rx="8" fill="#eee1c8"/>
              <circle cx="-29" cy="-9" r="3" fill="#38251d"/><circle cx="-11" cy="9" r="3" fill="#38251d"/>
              <rect x="7" y="-11" width="36" height="36" rx="8" fill="#2b231f" stroke="#55483e"/>
              <circle cx="16" cy="-2" r="3" fill="#eadcc4"/><circle cx="34" cy="16" r="3" fill="#eadcc4"/><circle cx="25" cy="7" r="3" fill="#eadcc4"/>
            </g>
          </svg>
        </div>
        <div class="card-body">
          <div class="card-copy">
            <span class="kind">Board game</span>
            <h2>Backgammon</h2>
            <p>Race, block, and bear off in a timeless strategy game.</p>
          </div>
          <span class="play">Enter table <span class="arrow">→</span></span>
        </div>
      </a>

      <a class="game-card" href="https://preferans.129.146.112.160.sslip.io" aria-label="Play Preferans">
        <div class="art cards-art" aria-hidden="true">
          <svg class="cards" viewBox="0 0 620 330" role="presentation">
            <defs>
              <linearGradient id="tableGlow" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#373024"/>
                <stop offset="1" stop-color="#17150f"/>
              </linearGradient>
              <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#fffaf0"/>
                <stop offset="1" stop-color="#e9dfcb"/>
              </linearGradient>
              <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="200%">
                <feDropShadow dx="0" dy="18" stdDeviation="13" flood-color="#000" flood-opacity=".44"/>
              </filter>
            </defs>
            <rect width="620" height="330" fill="url(#tableGlow)"/>
            <ellipse cx="310" cy="273" rx="184" ry="27" fill="#b47835" opacity=".12"/>

            <g filter="url(#cardShadow)">
              <g transform="translate(173 76) rotate(-14 72 105)">
                <rect width="144" height="210" rx="13" fill="url(#paper)" stroke="#fff8e7"/>
                <text x="18" y="35" class="card-rank">A</text>
                <text x="18" y="58" class="card-suit black">♠</text>
                <text x="72" y="130" text-anchor="middle" class="card-center black">♠</text>
                <text x="126" y="175" text-anchor="end" class="card-rank card-rotate">A</text>
                <text x="126" y="198" text-anchor="end" class="card-suit black card-rotate">♠</text>
              </g>

              <g transform="translate(238 55) rotate(-4 72 105)">
                <rect width="144" height="210" rx="13" fill="url(#paper)" stroke="#fff8e7"/>
                <text x="18" y="35" class="card-rank red">10</text>
                <text x="18" y="58" class="card-suit red">♦</text>
                <g class="pip red" text-anchor="middle">
                  <text x="48" y="89">♦</text><text x="96" y="89">♦</text>
                  <text x="48" y="126">♦</text><text x="96" y="126">♦</text>
                  <text x="48" y="163">♦</text><text x="96" y="163">♦</text>
                  <text x="72" y="108">♦</text><text x="72" y="145">♦</text>
                </g>
              </g>

              <g transform="translate(308 62) rotate(8 72 105)">
                <rect width="144" height="210" rx="13" fill="url(#paper)" stroke="#fff8e7"/>
                <text x="18" y="35" class="card-rank">K</text>
                <text x="18" y="58" class="card-suit black">♣</text>
                <circle cx="72" cy="111" r="40" fill="#c9b487" opacity=".32"/>
                <text x="72" y="127" text-anchor="middle" class="king-mark">K</text>
                <text x="72" y="166" text-anchor="middle" class="card-center black small">♣</text>
              </g>
            </g>
          </svg>
        </div>
        <div class="card-body">
          <div class="card-copy">
            <span class="kind">Card game</span>
            <h2>Preferans</h2>
            <p>Bid, plan, and outplay the table in the classic trick-taking game.</p>
          </div>
          <span class="play">Enter table <span class="arrow">→</span></span>
        </div>
      </a>
    </section>
  </main>
</body>
</html>
