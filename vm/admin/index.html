<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Games Server Admin</title>
  <link rel="stylesheet" href="/admin.css?v=20260816-5">
</head>
<body>
  <main class="wrap">
    <header><div><span class="eyebrow">SERVER ADMIN</span><h1>Games platform</h1><p>Deploy and inspect applications on this VM.</p></div><button id="logout" class="ghost hidden">Sign out</button></header>

    <section id="loginPanel" class="login panel">
      <h2>Administrator sign in</h2>
      <form id="loginForm"><label>Username<input id="username" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button><p id="loginError" class="error"></p></form>
    </section>

    <section id="dashboard" class="hidden">
      <div class="toolbar"><span id="updated">Loading…</span><button id="refresh" class="ghost">Refresh</button></div>
      <div id="apps" class="apps"></div>
    </section>
  </main>

  <template id="appTemplate"><article class="panel app"><div class="app-head"><div><div class="status-row"><span class="dot"></span><span class="state">Unknown</span></div><h2 class="name"></h2><a class="url" target="_blank" rel="noreferrer"></a></div><div class="actions"><button class="deploy">Deploy latest</button><button class="restart ghost">Restart</button></div></div><div class="meta"><div><span>Current commit</span><strong class="commit">—</strong></div><div><span>Last deployed</span><strong class="deployedAt">—</strong></div></div><div class="log-section"><button type="button" class="log-toggle ghost" aria-expanded="false">Deployment log</button><div class="log-panel hidden"><pre class="log">Open to load log.</pre></div></div></article></template>
  <script src="/admin.js?v=20260816-5"></script>
</body>
</html>
